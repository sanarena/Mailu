# Mailu connection secrets for in-cluster MCP testing.
# Fill in real values, then:
#   kubectl apply -f mcp/k8s/secret.yaml   (keep this file OUT of git)
apiVersion: v1
kind: Secret
metadata:
  name: mailu-mcp-env
  namespace: default
type: Opaque
stringData:
  MAILU_IMAP_HOST: "mail.example.com"
  MAILU_IMAP_PORT: "993"
  MAILU_IMAP_USER: "you@example.com"
  MAILU_IMAP_PASSWORD: "changeme"
  MAILU_SMTP_HOST: "mail.example.com"
  MAILU_SMTP_PORT: "587"
  MAILU_SMTP_USER: "you@example.com"
  MAILU_SMTP_PASSWORD: "changeme"
  MAILU_DEFAULT_FROM: "you@example.com"
  MAILU_API_BASE: "https://mail.example.com/api"
  MAILU_API_TOKEN: "changeme"
  MCP_HTTP_ADMIN_TOKEN: "put-a-long-random-token-here"
