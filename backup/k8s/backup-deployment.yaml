# Per-mailbox IMAP backup (Settings > Backup in webmail). Reads mailboxes
# over trusted-net IMAP from dovecot (like mail-scheduler) and appends new
# messages to each user's own IMAP target over verified TLS.
# Live-only secrets (never in git): backup-api (api-secret, shared with
# the webmail initContainer) and backup-crypt (crypt-key, Fernet key for
# target passwords at rest; losing it only means users re-enter them).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-backup
  namespace: mail
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mail-backup
  template:
    metadata:
      labels:
        app: mail-backup
    spec:
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
      containers:
        - name: backup
          image: sanarena/mail-backup@sha256:5ece435819a94ced0a6c4369d124c2833e042dc1971d668b08d958a635268b7b  # 1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 8080
          env:
            - name: DOVECOT_HOST
              value: mail-mailu-dovecot.mail.svc.cluster.local
            - name: DB_PATH
              value: /data/backup.db
            - name: POLL_SECONDS
              value: "300"
            - name: API_SECRET
              valueFrom:
                secretKeyRef:
                  name: backup-api
                  key: api-secret
            - name: CRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: backup-crypt
                  key: crypt-key
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: web
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: web
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mail-backup-data
